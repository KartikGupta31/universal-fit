spring:
  application:
    name: universal-fit-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/universalfit}
      auto-index-creation: true   # indexes are declared on the document classes

server:
  port: 8080

universalfit:
  seed:
    demo-data: ${SEED_DEMO_DATA:false}   # DEMO / UNVERIFIED brands and size charts only
  engine:
    base-url: ${ENGINE_BASE_URL:http://localhost:8000}
    api-key: ${ENGINE_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:}               # required from 2B onward; never commit a value
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:14}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
