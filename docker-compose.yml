
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.runCommand({ping: 1}).ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build: ./engine
    environment:
      ENGINE_API_KEY: ${ENGINE_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        BUILD_TIME: ${BUILD_TIME:-local}
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/universalfit
      ENGINE_BASE_URL: http://engine:8000
      REDIS_URL: redis://redis:6379
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_REAL_BRAND_DATA: ${SEED_REAL_BRAND_DATA:-false}
      CLEANUP_DEMO_DATA: ${CLEANUP_DEMO_DATA:-false}
    depends_on:
      mongo:
        condition: service_healthy
      engine:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mongo_data:
