services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  engine:
    build: ./engine
    environment:
      ENGINE_API_KEY: ${ENGINE_API_KEY}
    ports: ["8000:8000"]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [mongo, engine]
    ports: ["8080:8080"]

volumes:
  mongo_data:
