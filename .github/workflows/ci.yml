name: CI

on:
  push:
    branches:
      - main
      - fix/security-recommendation-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B -f backend/pom.xml test

  engine:
    name: Python recommendation engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install engine and test dependencies
        working-directory: engine
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Run engine tests
        working-directory: engine
        run: python -m pytest -q tests
